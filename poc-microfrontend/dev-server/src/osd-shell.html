    <!-- OSD Loading Message (mirrors template.tsx) -->

        <div class="osdLoaderWrap" data-test-subj="loadingLogo">
            <div class="loadingLogoContainer">
                <img class="loadingLogo darkOnly" src="/ui/default_branding/opensearch_spinner_on_light.svg" alt="OpenSearch Dashboards logo" loading="eager" />
                <img class="loadingLogo lightOnly" src="/ui/default_branding/opensearch_spinner_on_dark.svg" alt="OpenSearch Dashboards logo" loading="eager" />
            </div>
            <div class="osdWelcomeText" data-error-message="OpenSearch Dashboards did not load properly. Check the server output for more information.">
                Loading OpenSearch Dashboards
            </div>
            <div class="osdProgress darkOnly"></div>
            <div class="osdProgress lightOnly"></div>
        </div>
    </div>
    
    <!-- OSD Legacy Browser Error (mirrors template.tsx) -->
    <div class="osdWelcomeView" id="osd_legacy_browser_error" style="display: none;">
        <img src="/ui/default_branding/opensearch_mark_default.svg" alt="OpenSearch Dashboards logo" class="legacyBrowserErrorLogo darkOnly" />
        <img src="/ui/default_branding/opensearch_mark_default.svg" alt="OpenSearch Dashboards logo" class="legacyBrowserErrorLogo lightOnly" />
        <h2 class="osdWelcomeTitle">Please upgrade your browser</h2>
        <div class="osdWelcomeText">This OpenSearch installation has strict security requirements enabled that your current browser does not meet.</div>
    </div>

    <!-- CSP Test Script (mirrors template.tsx) -->
    <script>
        // Since this is an unsafe inline script, this code will not run
        // in browsers that support content security policy(CSP). This is
        // intentional as we check for the existence of __osdCspNotEnforced__ in
        // bootstrap.
        window.__osdCspNotEnforced__ = true;
    </script>

    <!-- Module Federation Bootstrap Script (adapted from bootstrap.js.hbs) -->
    <script>
        console.log('🚀 Starting OSD Module Federation Bootstrap...');
        
        // Setup OSD global variables (mirrors bootstrap.js.hbs)
        var osdCsp = JSON.parse(document.querySelector('osd-csp').getAttribute('data'));
        window.__osdStrictCsp__ = osdCsp.strictCsp;
        window.__osdPublicPath__ = { "bundles": "/bundles/", "osd-ui-shared-deps": "/shared-deps/" };
        window.__osdThemeTag__ = 'v8light'; // Default theme
        
        // Check CSP and show loading or error
        if (window.__osdStrictCsp__ && window.__osdCspNotEnforced__) {
            var legacyBrowserError = document.getElementById('osd_legacy_browser_error');
            legacyBrowserError.style.display = 'flex';
        } else {
            if (!window.__osdCspNotEnforced__ && window.console) {
                window.console.log("^ A single error about an inline script not firing due to content security policy is expected!");
            }

            // Show loading message
            var loadingMessage = document.getElementById('osd_loading_message');
            loadingMessage.style.display = 'flex';

            // OSD Module Federation Bootstrap
            window.onload = async function () {
                console.log('🔧 Loading OSD via Module Federation...');
                
                try {
                    // Step 1: Load CSS stylesheets (same as original bootstrap)
                    const styleSheetPaths = [
                        '/shared-deps/osd-ui-shared-deps.css',
                        '/shared-deps/osd-ui-shared-deps.v8.light.css'
                    ];
                    
                    function loadStyleSheet(url) {
                        return new Promise((resolve, reject) => {
                            var dom = document.createElement('link');
                            dom.rel = 'stylesheet';
                            dom.type = 'text/css';
                            dom.href = url;
                            dom.addEventListener('error', reject);
                            dom.addEventListener('load', resolve);
                            var target = document.querySelector('head meta[name="add-styles-here"]');
                            document.head.insertBefore(dom, target);
                        });
                    }
                    
                    // Load all stylesheets
                    await Promise.all(styleSheetPaths.map(loadStyleSheet));
                    console.log('✅ Theme CSS loaded');
                    
                    // Step 2: Debug available containers and wait for Module Federation containers
                    console.log('🔍 Debug: Available window variables:', Object.keys(window).filter(key => 
                        key.includes('shared') || key.includes('core') || key.includes('deps') || key.includes('osd')
                    ));
                    
                    function waitForContainer(containerName, maxAttempts = 50) {
                        return new Promise((resolve, reject) => {
                            let attempts = 0;
                            const checkContainer = () => {
                                attempts++;
                                if (window[containerName]) {
                                    console.log(`✅ Container ${containerName} ready after ${attempts} attempts`);
                                    resolve(window[containerName]);
                                } else if (attempts >= maxAttempts) {
                                    console.log(`❌ Container ${containerName} not found. Available containers:`, Object.keys(window).filter(key => 
                                        key.includes('shared') || key.includes('core') || key.includes('deps')
                                    ));
                                    reject(new Error(`Container ${containerName} not available after ${maxAttempts} attempts`));
                                } else {
                                    if (attempts % 10 === 0) {
                                        console.log(`⏳ Still waiting for ${containerName} (attempt ${attempts})`);
                                    }
                                    setTimeout(checkContainer, 100); // Check every 100ms
                                }
                            };
                            checkContainer();
                        });
                    }
                    
                    // Step 3: Load both containers in parallel
                    const [coreContainer, sharedContainer] = await Promise.all([
                        waitForContainer('core_services'),
                        waitForContainer('shared_deps') // MF container, not traditional library
                    ]);
                    
                    // Step 4: Load shared dependencies via Module Federation and create traditional global
                    const sharedBundleModule = await sharedContainer.get('./SharedBundle');
                    const sharedBundle = sharedBundleModule();
                    
                    // Create traditional global for compatibility with existing OSD code
                    window.__osdSharedDeps__ = sharedBundle;
                    console.log('✅ Shared dependencies loaded via MF and available as __osdSharedDeps__');
                    
                    // Step 5: Load core services via Module Federation
                    const coreServicesModule = await coreContainer.get('./CoreServices');
                    const coreServices = coreServicesModule();
                    console.log('✅ Core services loaded via Module Federation');
                    
                    // Step 5: Setup lazy-loading __osdBundles__ interface for Module Federation
                    const loadedPluginContainers = new Map();
                    const availablePlugins = ['opensearchDashboardsLegacy']; // Plugin registry
                    
                    async function loadPluginContainerOnDemand(pluginName) {
                        if (loadedPluginContainers.has(pluginName)) {
                            return loadedPluginContainers.get(pluginName);
                        }
                        
                        try {
                            console.log(`🔄 Loading plugin container on-demand: ${pluginName}`);
                            
                            // Dynamically load the plugin remoteEntry
                            await new Promise((resolve, reject) => {
                                const script = document.createElement('script');
                                script.src = `/plugins/${pluginName}/remoteEntry.js`;
                                script.onload = resolve;
                                script.onerror = reject;
                                document.head.appendChild(script);
                            });
                            
                            // Access the plugin container
                            const containerName = pluginName + '_plugin';
                            const container = window[containerName];
                            if (container) {
                                loadedPluginContainers.set(pluginName, container);
                                console.log(`✅ Plugin container loaded on-demand: ${pluginName}`);
                                return container;
                            } else {
                                console.error(`❌ Plugin container not found: ${containerName}`);
                                return null;
                            }
                        } catch (error) {
                            console.error(`❌ Failed to load plugin ${pluginName}:`, error);
                            return null;
                        }
                    }
                    
                    window.__osdBundles__ = {
                        get: function(bundleName) {
                            if (bundleName === 'entry/core/public') {
                                return coreServices; // Return core services from MF
                            }
                            
                            // Handle plugin bundles with lazy loading
                            const pluginMatch = bundleName.match(/^plugin\/(.+)\/public$/);
                            if (pluginMatch) {
                                const pluginName = pluginMatch[1];
                                if (availablePlugins.includes(pluginName)) {
                                    // Return a promise that resolves to the plugin
                                    return loadPluginContainerOnDemand(pluginName).then(container => {
                                        if (container) {
                                            return container.get('./Plugin').then(module => ({ plugin: module.default || module }));
                                        }
                                        return null;
                                    });
                                }
                            }
                            
                            return null;
                        },
                        has: function(bundleName) {
                            if (bundleName === 'entry/core/public') {
                                return true;
                            }
                            
                            // Check if plugin is available (without loading it)
                            const pluginMatch = bundleName.match(/^plugin\/(.+)\/public$/);
                            if (pluginMatch) {
                                const pluginName = pluginMatch[1];
                                return availablePlugins.includes(pluginName);
                            }
                            
                            return false;
                        },
                        getIds: function() {
                            const pluginIds = availablePlugins.map(name => `plugin/${name}/public`);
                            return ['entry/core/public', ...pluginIds];
                        }
                    };
                    
                    console.log('✅ Lazy-loading plugin system ready via Module Federation');
                    
                    // Step 6: Call OSD bootstrap (same as traditional)
                    if (coreServices && coreServices.__osdBootstrap__) {
                        coreServices.__osdBootstrap__();
                        console.log('🎉 OSD Application bootstrapped via Module Federation!');
                    } else {
                        console.log('🔧 Core services loaded, manual initialization required');
                        // Hide loading message to show our federation worked
                        loadingMessage.style.display = 'none';
                        document.body.innerHTML += '<div style="padding: 40px; text-align: center;"><h1>🎉 OSD Module Federation Ready!</h1><p>Core services loaded successfully via Module Federation</p></div>';
                    }
                    
                } catch (error) {
                    console.error('❌ OSD Module Federation bootstrap failed:', error);
                    // Show error in loading message
                    loadingMessage.querySelector('.osdWelcomeText').textContent = 'Module Federation bootstrap failed: ' + error.message;
                }
            };
        }
    </script>
    
    <!-- Load Module Federation entry points -->
    <!-- Module Federation will automatically handle all dependencies -->
    <script src="/shared-deps/remoteEntry.js"></script>
    <script src="/core/remoteEntry.js"></script>
</body>
</html>
